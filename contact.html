<body>

<header class="site-header">
  <div class="wrap">
    <a class="brand" href="index.html">
      <span class="wordmark">emma saunders</span>
      <span class="role">director / performer / choreographer</span>
    </a>
    <button class="nav-toggle" aria-label="Toggle menu" aria-expanded="false">
      <span></span><span></span><span></span>

        <li><a href="bio.html">Bio</a></li>
      </ul>
    </nav>
  </div>
</header>

<div class="wrap">
  <div class="contact-wrap">
    <div class="contact-info">
      <span class="eyebrow">Get in Touch</span>
      <h1>Contact Us</h1>
      <p class="lede">Have a question about a project, workshop or collaboration? Send a message below.</p>
      <a class="social" href="https://www.instagram.com/emmasaundersemma/" target="_blank" rel="noopener">Follow on Instagram →</a>
    </div>

    <div>
      <form class="contact-form" data-to="hello@example.com">
        <div class="form-row">
          <div class="field">
            <label for="name">Name</label>
            <input type="text" id="name" name="name" required>
          </div>
          <div class="field">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>
          </div>
        </div>
        <div class="field">
          <label for="phone">Phone</label>
          <input type="tel" id="phone" name="phone">
        </div>
        <div class="field">
          <label for="message">Message</label>
          <textarea id="message" name="message" required></textarea>
        </div>
        <div>
          <button type="submit" class="btn btn-solid">Send Message</button>
          <p class="form-status" role="status"></p>
        </div>
      </form>
    </div>
  </div>
</div>

<footer class="site-footer">
  <div class="wrap">
    <span class="wordmark">emma saunders</span>
    <div class="footer-social">
      <a href="https://www.instagram.com/emmasaundersemma/" target="_blank" rel="noopener" aria-label="Instagram">

      </a>
    </div>
    <span class="fine-print">© <span id="year"></span> Emma Saunders Dance</span>
  </div>
</footer>
